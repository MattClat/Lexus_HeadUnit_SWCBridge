plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mattc.swcbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.mattc.swcbridge"
        minSdk 21
        // Deliberately low: keeps Android 7 (API 24) semantics on the head unit
        // and avoids background-execution / package-visibility guard code.
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk 24
        versionCode 11
        versionName "0.9.2"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    // Names the APK swc-bridge-0.1-debug.apk instead of app-debug.apk.
    // applicationVariants is deprecated in AGP 8 (a build warning is expected and
    // harmless) but it is still the only way to set the APK filename. Delete this
    // block if you ever move to AGP 9.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "swc-bridge-${variant.versionName}-${variant.name}.apk"
        }
    }
}

// No dependencies on purpose. Framework APIs only, so the APK stays tiny
// and installs cleanly on a 2020-era MTK head unit.
dependencies {
}
